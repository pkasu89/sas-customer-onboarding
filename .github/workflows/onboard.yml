name: SAS Customer Onboarding

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: "Customer ID"
        required: true
        type: string

      company_name:
        description: "Company Name"
        required: true
        type: string

      motto:
        description: "Company Motto"
        required: true
        type: string

jobs:
  onboard:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create purchase JSON
        shell: powershell
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          COMPANY_NAME: ${{ inputs.company_name }}
          MOTTO: ${{ inputs.motto }}
        run: |
          $customer = @{
            customer_id = $env:CUSTOMER_ID
            company_name = $env:COMPANY_NAME
            motto = $env:MOTTO
          }

          $json = $customer | ConvertTo-Json
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("purchase.json", $json, $utf8)

      - name: Validate customer details
        shell: powershell
        run: |
          python scripts/onboard.py purchase.json --dry-run

      - name: Verify deployment tools
        shell: powershell
        run: |
          python --version
          helm version --short
          kubectl config current-context
          kubectl get nodes